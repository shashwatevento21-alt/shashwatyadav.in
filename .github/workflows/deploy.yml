name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy main site to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/CNAME
            **/deploy-creators-subfolder
            **/deploy-creators-subfolder/**

      # Front controller for the separately-deployed Laravel app at
      # shashwatyadav.in/creators — see creator-platform/deploy/DEPLOYMENT.md.
      # The actual Laravel app (app/, vendor/, storage/, etc.) is uploaded
      # manually outside public_html and is NOT managed by this workflow.
      - name: Deploy /creators front controller to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-creators-subfolder/
          server-dir: /public_html/creators/
