name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploys only the static site. /public_html/creators/ (the Laravel
      # Creator Marketplace app) is managed entirely outside this pipeline
      # and must never be touched here — excluded below, and no step in
      # this workflow ever targets server-dir /public_html/creators/.
      - name: Deploy main site to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/CNAME
            **/deploy-creators-subfolder
            **/deploy-creators-subfolder/**
            creators
            creators/**
